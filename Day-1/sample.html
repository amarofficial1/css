<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS</title>
    <style>
        h1{
            background-color: blueviolet;
            font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            color: beige;
            text-decoration: underline;
            text-align: center;
        }
        .am{
            background-color: aquamarine;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: aliceblue;
            text-align: left;
        }
        .nav{
            list-style: none;
            display: flex;
            justify-content:end;
            background-color: rgb(55, 193, 193);
            padding: 30px;
        }
        .nav li{
            padding-left: 10px;
        }
        .nav li a:hover{
            color: rgb(255, 0, 0);
            font-size: x-large;

        }
        .nav li a{
            text-decoration: none;
        }
    </style>
</head>
<body>
    <p style="background-color: rgb(255, 153, 0); font-family: Arial, Helvetica, sans-serif; font-size: x-large; font-style: italic; text-align: center; text-decoration: underline; text-decoration-color: rgb(0, 255, 13);
    text-transform: capitalize;">Welcome to css</p>
    <h1>hi all</h1>
    <h1 class="am">hi everyone</h1>
    <ul class="nav">
        <li><a href="">Home</a></li>
        <li><a href="">About Us</a></li>
        <li><a href="">Courses</a></li>
        <li><a href="">Logout</a></li>
    </ul>
</body>
</html>
