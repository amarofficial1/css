<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body{
            background-color: rgb(236, 214, 255);
           
        }
        h2{
            text-align: center;
            color: blueviolet;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: x-large;
            padding-top: 30px;
        }
        h3{
            margin-top: 15px;
            margin-bottom: 2px;
        }
         .table{
            width: 300px;
            border-style: none;
            background-color: rgb(255, 255, 255);
            margin: auto;
            margin-top: 200px;
         }
         .login{
            padding: 20px;
         }
         .btn{
            background-color: blueviolet;
            color: azure;
         }
         .textbox{
            width: 100%;box-sizing: border-box;
            padding: 10px;
        }
        .login a{
            text-decoration: none;
            color: #E18FFA;
        }
        .login a:hover{
            color: crimson;
        }
        .option{
            display: flex;
            margin-top: 10px;
            justify-content: space-between;
            box-sizing: border-box;
        }
        .text{
            text-align: center;
        }
    </style>
</head>
<body>
    <form action="">
    <div class="table">
        <h2>Login</h2>
        <div class="login">
            <h3>Email:</h3>
            <input type="email" placeholder="enter your email" required class="textbox">
            <h3>Password:</h3>
            <input type="password" placeholder="enter your password" required class="textbox"> 
            <div class="option">
                <input type="submit" value="Login" class="btn">
                <a href="">Forgot password?</a>
            </div>
            <br>
            <div class="text">
            Don't have an account?<a href="">Sign up</a>
            </div>
        </div>
    </div>
</form>
</body>
</html>
