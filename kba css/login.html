<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="./stylecss/loginstyle.css">
</head>
<body>
    <div class="table">
    <form action="./homepage.html">
        <h2>Login</h2>
    <div class="login">
        <h4>Email:</h4>
        <input type="email" placeholder="enter your email" required class="textbox">
        <h4>Password:</h4>
        <input type="password" placeholder="enter your password" required class="textbox"> 
        <div class="option"><input type="submit" value="Login" class="btn">
        <a href="">Forgot password?</a></div>
        <div class="text"><br>
        Don't have an account?<a href="./signup.html">&nbsp;Sign up</a></div>

    </div>

    </div>
</form>
</body>
</html>
