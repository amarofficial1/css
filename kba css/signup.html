<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signups</title>
    <link rel="stylesheet" href="./stylecss/signupstyle.css">
</head>
<body>
    <div class="table">
    <form action="./homepage.html">
        <h2>Signup</h2>
    <div class="sign">
        <h4>Name:</h4>
        <input type="text" placeholder="enter your name" required class="textbox">
        <h4>Email:</h4>
        <input type="email" placeholder="enter your email" required class="textbox">
        <h4>Password:</h4>
        <input type="password" placeholder="enter your password" required class="textbox"> 
        <h4>Price</h4>
        <select name="price" class="drop">
            <option value="5000">5000</option>
            <option value="15000">15000</option>
            <option value="25000">25000</option>
            
        </select>

        <div class="option"><input type="submit" value="Signup" class="btn">
        </div>
        <div class="text"><br>
        Already have an account?<a href="./login.html">&nbsp;Login</a></div>

    </div>

    </div>
</form>
</body>
</html>
